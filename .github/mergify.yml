# .github/mergify.yml
pull_request_rules:
  - name: "Auto approve and fast-forward master to azure-pipelines"
    conditions:
      - base=azure-pipelines
      - head=sync-master-to-azure-pipelines
      - author=github-actions[bot]
    actions:
      review:
        type: APPROVE
      merge:
        method: fast-forward
